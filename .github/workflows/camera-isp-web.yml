name: Camera ISP web installer
on:
  push:
    branches: [codex/voice-local-trial]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-hardware-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node tests/test_web_monitor.mjs
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: firmware-recognition
          path: dist/recognition
      - name: Verify the exact CI recognition artifact and generate installer
        run: |
          (cd dist/recognition && sha256sum --strict -c SHA256SUMS)
          python tools/build_web_installer.py --source-commit "$GITHUB_SHA"
          (cd web-dist && sha256sum --strict -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-hardware-web
          path: web-dist
          if-no-files-found: error
  publish:
    needs: [checks, host, build]
    if: github.ref == 'refs/heads/codex/voice-local-trial'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: voice-hardware-web
          path: web-dist
      - name: Publish CI-verified hardware test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd web-dist && sha256sum --strict -c SHA256SUMS)
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/voice-local-trial" --jq '.object.sha')
          [[ "$head" == "$GITHUB_SHA" ]]
          tag="voice-test-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; no asset overwrite."
            exit 0
          fi
          gh release create "$tag" web-dist/index.html web-dist/home_buddy.bin web-dist/SHA256SUMS web-dist/HARDWARE_TEST.md web-dist/THIRD_PARTY_NOTICES.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "Home Buddy 0.15.0 voice hardware test ($tag)" --notes "CI-verified experimental app-only update; existing single-factory-v1 and installed MBF / speaker 3s models required. No erase, no physical acceptance, no voice/BOTH HA events. See HARDWARE_TEST.md."
