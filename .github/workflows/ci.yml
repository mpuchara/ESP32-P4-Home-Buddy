name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python tools/check_project.py
      - run: git diff --check
      - run: python tools/check_format.py
      - run: cmake -S tests -B build-host && cmake --build build-host && ctest --test-dir build-host --output-on-failure
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      fail-fast: false
      matrix:
        profile: [diagnostics, bringup, wifi]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build pinned firmware
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          cp dependencies.lock "$RUNNER_TEMP/dependencies-$PROFILE.lock"
          . /opt/esp/idf/export.sh
          cd "$GITHUB_WORKSPACE"
          defaults=sdkconfig.defaults
          if [ "$PROFILE" != diagnostics ]; then defaults="$defaults;config/sdkconfig.$PROFILE"; fi
          idf.py -D "SDKCONFIG_DEFAULTS=$defaults" set-target esp32p4
          idf.py build
          cd "$GITHUB_WORKSPACE"
          cmp dependencies.lock "$RUNNER_TEMP/dependencies-$PROFILE.lock"
          python tools/check_effective_config.py build/config/sdkconfig.json "$PROFILE"
          python tools/package_firmware.py build "dist/$PROFILE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-${{ matrix.profile }}
          path: dist/${{ matrix.profile }}
          if-no-files-found: error
