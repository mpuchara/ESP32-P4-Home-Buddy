name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python tools/check_project.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: bash tools/test_sanitizers.sh
      - run: git diff --check
      - run: python tools/check_format.py
      - name: Fetch pinned LVGL font decoder for host regression
        run: |
          git init "$RUNNER_TEMP/lvgl-font"
          git -C "$RUNNER_TEMP/lvgl-font" remote add origin https://github.com/lvgl/lvgl.git
          git -C "$RUNNER_TEMP/lvgl-font" fetch --depth 1 origin 396f70508480f79725fc1354cd290cc83f69b2ef
          git -C "$RUNNER_TEMP/lvgl-font" checkout --detach FETCH_HEAD
          git init "$RUNNER_TEMP/cjson"
          git -C "$RUNNER_TEMP/cjson" remote add origin https://github.com/DaveGamble/cJSON.git
          git -C "$RUNNER_TEMP/cjson" fetch --depth 1 origin 8f2beb57ddad1f94bed899790b00f46df893ccac
          git -C "$RUNNER_TEMP/cjson" checkout --detach FETCH_HEAD
      - run: cmake -S tests -B build-host -D LVGL_SOURCE_DIR="$RUNNER_TEMP/lvgl-font" -D CJSON_SOURCE_DIR="$RUNNER_TEMP/cjson" && cmake --build build-host && ctest --test-dir build-host --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-ui-host-render
          path: build-host/product-*.ppm
          if-no-files-found: error
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      fail-fast: false
      matrix:
        profile: [diagnostics, bringup, wifi, recognition]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build pinned firmware
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          cp dependencies.lock "$RUNNER_TEMP/dependencies-$PROFILE.lock"
          . /opt/esp/idf/export.sh
          cd "$GITHUB_WORKSPACE"
          defaults=sdkconfig.defaults
          if [ "$PROFILE" != diagnostics ]; then defaults="$defaults;config/sdkconfig.$PROFILE"; fi
          idf.py -D "SDKCONFIG_DEFAULTS=$defaults" set-target esp32p4
          idf.py build
          cd "$GITHUB_WORKSPACE"
          cmp dependencies.lock "$RUNNER_TEMP/dependencies-$PROFILE.lock"
          python tools/check_effective_config.py build/config/sdkconfig.json "$PROFILE"
          python -m unittest discover -s tests -p 'test_*.py'
          if [ "$PROFILE" = recognition ]; then python tools/identity_flash_budget.py build --enforce; fi
          python tools/package_firmware.py build "dist/$PROFILE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-${{ matrix.profile }}
          path: dist/${{ matrix.profile }}
          if-no-files-found: error
